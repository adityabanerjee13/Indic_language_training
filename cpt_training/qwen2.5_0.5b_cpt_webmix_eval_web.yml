# ==============================================================================
# Axolotl standalone-evaluate config — WEB-only (FineWeb) held-out loss for the
# checkpoint trained by qwen2.5_0.5b_cpt_webmix.yml (Indic+FineWeb 1:1 mix).
#
# Way 2: run this AFTER training to get a web-only eval_loss on data never
# seen in training (see the companion _eval_indic.yml for the Indic number):
#
#   axolotl evaluate qwen2.5_0.5b_cpt_webmix_eval_web.yml
#
# Settings below (sequence_len, eval_sample_packing, batch size) are kept
# identical to the indic eval config so the two numbers are directly comparable.
# ==============================================================================

base_model: ./outputs/qwen2.5-0.5b-indic-webmix-cpt-full   # trained checkpoint
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: false

# Same held-out FineWeb slice as the training config's test_datasets.
test_datasets:
  - path: HuggingFaceFW/fineweb
    data_files: sample/10BT/000_00000.parquet   # single 2.15 GB file, not all 30 GB
    type: completion
    field: text
    split: train[29577:30777]

val_set_size: 0
dataset_num_proc: 1
dataset_prepared_path: ./last_run_prepared_eval_web
output_dir: ./outputs/qwen2.5-0.5b-indic-webmix-cpt-full/eval-web

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true
eval_sample_packing: false
micro_batch_size: 4

bf16: auto
tf32: true
flash_attention: true

wandb_project: indic-cpt
wandb_entity: models-na9841
wandb_name: qwen2.5-0.5b-indic-webmix-cpt-full-eval-web

special_tokens:
